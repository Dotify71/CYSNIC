name: CYSNIC CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libopencv-dev fftw3-dev libtbb-dev clang-tidy

    - name: Configure CMake (Standard)
      run: cmake -B build

    - name: Build (Standard)
      run: cmake --build build -j$(nproc)

    - name: Test (Standard)
      run: cd build && ctest --output-on-failure

    - name: Run Clang-Tidy Static Analysis
      run: |
        cmake -B build_tidy -DUSE_CLANG_TIDY=ON
        cmake --build build_tidy -j$(nproc)

    - name: Build with ASan and UBSan
      run: |
        cmake -B build_sanitizers -DUSE_SANITIZERS=ON
        cmake --build build_sanitizers -j$(nproc)

    - name: Test with Sanitizers
      run: cd build_sanitizers && ctest --output-on-failure
